name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 시점에 한 번만 배포한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      - name: 콘텐츠 무결성 검사
        run: npm run validate

      - name: 정적 사이트 빌드
        # 저장소 하위 경로(/저장소이름)로 서비스되므로 기준 경로를 알려 준다.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: 테스트
        run: npm test

      # _next 처럼 밑줄로 시작하는 폴더가 Pages에서 무시되지 않게 public/.nojekyll 을 둔다.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
